# 그룹 순서와 학회 배지 색상을 한곳에서 관리합니다.
# 아래 색상은 홈페이지용 사용자 지정 팔레트이며 학회의 공식 브랜드 색상이나 등급을 뜻하지 않습니다.
# 새 논문은 publications.yml에만 추가하면 됩니다. 미등록 학회는 기본 배지를 사용합니다.
groups:
  - id: international
    title: International Conferences
  - id: preprint
    title: Preprints
  - id: domestic
    title: Domestic Conferences

default_badge:
  background: "#eef2f6"
  text: "#516172"
  border: "#dce3eb"
preprint_badge:
