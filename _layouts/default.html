<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }} · {{ site.data.profile.affiliation.institution | escape }} AI</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta name="author" content="{{ site.data.profile.name | escape }}">
    <meta name="theme-color" content="#f7f7f5">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ site.title | escape }} · {{ site.data.profile.affiliation.institution | escape }} AI">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/img/social-card.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ site.data.profile.name | escape }} — GUI agents and multimodal reasoning">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preload" href="{{ '/assets/fonts/source-sans-3.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": {{ site.data.profile.name | jsonify }},
        "url": {{ '/' | absolute_url | jsonify }},
        "image": {{ site.data.profile.image | absolute_url | jsonify }},
        "jobTitle": {{ site.data.profile.role | jsonify }},
        "affiliation": {"@type": "Organization", "name": {{ site.data.profile.affiliation.school | append: ', ' | append: site.data.profile.affiliation.institution | jsonify }}},
        "email": {{ site.data.profile.email | prepend: 'mailto:' | jsonify }},
        "knowsAbout": {{ site.data.profile.interests | jsonify }}
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header" id="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}#about" aria-label="Yoonsik Park, home">
          <span>{{ site.data.profile.name | escape }}</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" hidden>
          <span class="menu-label">Menu</span>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <nav class="site-nav" id="site-navigation" aria-label="Main navigation">
          <a data-nav href="{{ '/' | relative_url }}#about">About</a>
          <a data-nav href="{{ '/' | relative_url }}#news">News</a>
          <a data-nav href="{{ '/' | relative_url }}#publication">Publications</a>
          <a data-nav href="{{ '/' | relative_url }}#experiences">Experience</a>
          <a data-nav href="{{ '/' | relative_url }}#education">Education</a>
        </nav>
      </div>
    </header>
    <main class="container main-content" id="main-content" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <a class="footer-name" href="{{ '/' | relative_url }}#about">{{ site.data.profile.name | escape }}</a>
        </div>
        <div class="footer-contact">
          <a href="mailto:{{ site.data.profile.email | escape }}">{{ site.data.profile.email | escape }}</a>
          <p>© {{ site.time | date: '%Y' }} · Updated {{ site.time | date: '%b %Y' }}</p>
        </div>
      </div>
    </footer>
    <div class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
